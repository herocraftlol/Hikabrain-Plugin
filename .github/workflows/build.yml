name: Build

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Build with Maven
      run: rm -rf ~/.m2/repository/com/hikabrain && mvn clean package -DskipTests
    
    - name: Rename JAR
      run: mv target/HikaBrain.jar target/HikaBrain-1.0.33.jar
    
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: HikaBrain-JAR
        path: target/HikaBrain-1.0.33.jar
