name: HikaBrain
version: 1.0.0
main: com.hikabrain.plugin.HikaBrainPlugin
api-version: 1.21
author: Claude
description: Plugin de minijeu Hikabrain (capture de zone par équipes) inspiré de l'automatisation type ScreamingBedwars

commands:
  hb:
    description: Commande principale du plugin Hikabrain
    usage: /hb <create|delete|list|arenas|setlobby|setspawn|delspawn|setcapture|setgamezone|start|stop|join|joinrandom|leave|info|stats|leaderboard>
  arenas:
    description: Ouvre le GUI de sélection d'arène
    usage: /arenas
    aliases: [arena]

permissions:
  hikabrain.admin:
    description: Permission pour administrer le jeu Hikabrain (hologramme, reset, setup arènes…)
    default: op
  hikabrain.play:
    description: Permission pour jouer au Hikabrain
    default: true
