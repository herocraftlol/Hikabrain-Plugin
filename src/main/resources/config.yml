# ===========================================
#         Configuration HikaBrain
# ===========================================

# Nombre de joueurs minimum pour lancer le compte à rebours du lobby
# (peut être surchargé par arène via /hb setminplayers)
min-players: 2

# Nombre de joueurs maximum (au-delà, équilibrage par équipe)
max-players: 16 # Valeur par défaut utilisée par toute arène sans max spécifique (voir /hb setmaxplayers)

# Durée du compte à rebours du lobby dès que le nombre minimum de joueurs est atteint (en secondes)
lobby-countdown-min-reached: 10

# Durée du compte à rebours quand le lobby est plein (accélère encore plus le départ)
lobby-countdown-fast: 10

# Nombre de points nécessaires pour gagner la partie
points-to-win: 5

# Durée (en secondes) du compte à rebours entre chaque round, après qu'un point a été marqué
round-reset-countdown: 5

# Durée (en secondes) du compte à rebours "in-game" juste après la téléportation des joueurs
# dans l'arène (à la fin du compte à rebours du lobby), pendant lequel ils sont gelés
# (même système que round-reset-countdown : ne peuvent pas bouger) avant que la capture
# ne soit réellement active.
game-start-countdown: 5

# Téléporte les joueurs au lobby au démarrage du plugin / fin de partie
teleport-to-lobby-on-end: true

# Restaure les joueurs à leur position d'avant le lobby à la fin de la partie
restore-pre-lobby-location: true

# Délai (secondes) avant de relancer un nouveau lobby après la fin d'une partie
restart-delay: 5

# Distance maximale (blocs) autorisée entre un spectateur et son point de téléportation
# spectateur, UNIQUEMENT utilisée en secours si l'arène n'a pas de zone de jeu (gamezone)
# configurée. Si une gamezone existe, les spectateurs sont confinés à cette zone à la place.
spectator-max-distance: 60

# ===========================================
#         Configuration Points & Niveaux
# ===========================================
levels:
  # Points gagnés par coup porté à un adversaire (le plus simple à obtenir)
  points-per-hit: 1

  # Points gagnés par kill
  points-per-kill: 5

  # Points gagnés par but marqué
  points-per-goal: 8

  # Points gagnés si l'équipe du joueur gagne la partie (le plus dur à obtenir)
  points-per-win: 15

  # Base du barème de progression des niveaux : le nombre de points cumulés nécessaires
  # pour ATTEINDRE le niveau N est "base-points * N * (N+1) / 2" (paliers progressifs :
  # l'écart entre deux niveaux consécutifs grandit à chaque niveau, donc de plus en plus dur).
  base-points: 100

# ===========================================
#    Export web du classement (site vitrine)
# ===========================================
# Expose un petit serveur HTTP JSON (endpoint /hikabrain/leaderboard) avec les stats
# de tous les joueurs (kills, morts, K/D, victoires, coups donnés/reçus, buts, temps de
# jeu, niveau, points), pour que le site web affiche un classement HikaBrain (onglet
# "Classements"). Même principe que le plugin Velocity "WebStatusVelocity" déjà utilisé
# pour le statut du réseau : authentification par clé API (en-tête X-Api-Key).
#
# DÉSACTIVÉ PAR DÉFAUT : n'importe qui pouvant atteindre ce port lirait sinon les
# statistiques de tous les joueurs. N'active que si le site web doit s'y connecter, et
# pense à changer 'api-key' ci-dessous.
web-export:
  enabled: false

  # Port d'écoute du mini serveur HTTP exposant le classement
  port: 8182

  # Adresse d'écoute : 127.0.0.1 si le backend Node du site tourne sur la même machine
  # que ce serveur Paper (recommandé). Mets 0.0.0.0 seulement si le backend est ailleurs,
  # et protège alors ce port avec un pare-feu.
  bind-address: "127.0.0.1"

  # Clé secrète à renseigner aussi côté backend du site (HIKABRAIN_API_KEY dans .env)
  api-key: "change-moi"

# ===========================================
#         Musique d'ambiance (facultative)
# ===========================================
# Joue une musique via les sons de bloc de notes vanilla pendant les parties (aucun
# plugin externe requis). Place tes fichiers .nbs dans plugins/HikaBrain/music/.
#
# ⚠️ Convertir une musique en blocs de notes ne supprime PAS ses droits d'auteur.
# Privilégie de la musique du domaine public (classique) ou explicitement libre de
# droits (incompetech.com, opengameart.org, pixabay.com/music...), convertie toi-même
# via Open Note Block Studio (https://opennbs.org). Pour trouver des .nbs déjà prêts :
# https://noteblock.world
music:
  enabled: false

  # "random" = tire une piste au hasard parmi plugins/HikaBrain/music/*.nbs à chaque
  # début de partie. Sinon, mets le nom exact d'un fichier (ex: "epique.nbs"), ou "off"
  # pour désactiver. Peut être surchargé arène par arène avec /hb music <arène> <choix>.
  default-track: "random"

  # Volume global (0.0 à 1.0). Chaque joueur peut aussi baisser/couper la musique lui-même
  # via le curseur "Disques" (Records) dans ses propres options de son Minecraft.
  volume: 1.0

  # Reboucle automatiquement la piste une fois terminée, tant que la partie continue
  loop: true

# ===========================================
#      Apparence des hologrammes (partagée)
# ===========================================
# S'applique à TOUS les hologrammes du plugin (statistiques personnelles ET classements
# top 10) : une seule apparence cohérente et configurable, plutôt qu'une config séparée
# par type. Techniquement, chaque hologramme est une seule entité TextDisplay (le vrai
# type "hologramme" natif de Minecraft depuis 1.19.4) — plus aucun scintillement lié à
# un ré-affichage périodique de plusieurs entités empilées.
hologram-style:
  # Fond derrière le texte : "default" (fond noir semi-transparent vanilla, comme un
  # panneau de texte flottant classique), "none" (totalement transparent, texte "nu"),
  # ou une couleur ARGB au format hexadécimal "#AARRGGBB" (ex: "#80202020" = gris foncé
  # à 50% d'opacité).
  background: "default"

  # Voir le texte à travers les blocs (true) ou seulement en vue directe (false)
  see-through: false

  # Légère ombre portée sous le texte, améliore la lisibilité sur fond clair
  shadow: true

  # Le texte fait-il toujours face au joueur qui le regarde ? CENTER (oui, dans toutes
  # les directions - recommandé), VERTICAL, HORIZONTAL, ou FIXED (jamais, orientation figée)
  billboard: "CENTER"

  # Largeur de ligne avant retour à la ligne automatique (en pixels de texte)
  line-width: 200

  # Échelle par défaut (multiplicateur de taille). Peut être surchargée individuellement
  # pour un leaderboard via /hb leaderboard <catégorie> size <taille>.
  scale: 1.0

# ===========================================
#         Configuration Scoreboard
# ===========================================
scoreboard:
  # Titre du scoreboard (affiché en haut)
  title: "&8[&b&lHEROCRAFT&8&l] &6&lHikaBrain"
  
  # Nom du serveur affiché dans le scoreboard
  server-name: "&b&lHEROCRAFT"
  
  # Nom du jeu affiché dans le scoreboard
  game-name: "&6&lHikaBrain"
  
  # Lignes du scoreboard (variables: %server%, %game%, %red_score%, %blue_score%, %red_kills%, %red_deaths%, %blue_kills%, %blue_deaths%, %red_kd%, %blue_kd%, %red_wins%, %blue_wins%, %players%, %elapsed_time%)
  # Sépare chaque ligne par un nouvelle entrée dans la liste
  lines:
    - "&7&m--------------------"
    - "&fServeur: &b%server%"
    - "&fJeu: &6%game%"
    - "&7&m--------------------"
    - "&f&l▸ &c❤ &fRouge: &c%red_score%"
    - "&f&l▸ &9❤ &9Bleu: &9%blue_score%"
    - "&7&m--------------------"
    - "&f&l▸ &cKills: &c%red_kills% &7/ &cDeaths: &c%red_deaths%"
    - "&f&l▸ &9Kills: &9%blue_kills% &7/ &9Deaths: &9%blue_deaths%"
    - "&7&m--------------------"
    - "&f&l▸ &cVictoires: &c%red_wins%"
    - "&f&l▸ &9Victoires: &9%blue_wins%"
    - "&7&m--------------------"
    - "&f&l▸ &cK/D: &c%red_kd%"
    - "&f&l▸ &9K/D: &9%blue_kd%"
    - "&7&m--------------------"
    - "&fTemps: &e%elapsed_time%"
    - "&fJoueurs: &a%players%"
    - "&7&m--------------------"

# Messages (couleurs avec & supportées)
messages:
  prefix: "&8[&bHikaBrain&8] &r"
  join: "&aTu as rejoint la partie ! &7(%current%/%max%)"
  leave: "&cTu as quitté la partie."
  team-assigned: "&7Tu es dans l'équipe %team%"
  team-changed: "&aTu as rejoint l'équipe %team%"
  countdown-start: "&eLa partie commence dans &6%time%&e secondes !"
  game-start: "&a&lLA PARTIE COMMENCE !"
  point-scored: "&6+%points% point(s) pour l'équipe %team% &7(%score%/%win%)"
  game-end: "&a&lL'équipe %team% a gagné la partie !"
  not-enough-players: "&cPas assez de joueurs pour démarrer."

# ===========================================
#         Configuration Tournois
# ===========================================
tournament:
  # Durée par défaut (secondes) d'une manche/course aux points avant décision au score/ratio
  default-time-limit-seconds: 600

  # Délai de préparation (secondes) entre l'annonce d'une phase (poules, huitièmes, quarts,
  # demies, finale...) et la téléportation automatique des joueurs dans leurs arènes.
  # Un décompte est annoncé (10s, 5s, 4s, 3s, 2s, 1s). Mettre 0 pour téléporter instantanément.
  round-prep-seconds: 15

  # Délai de grâce (secondes) avant qu'un joueur totalement déconnecté ne fasse perdre son équipe par forfait
  disconnect-grace-seconds: 60

  # Règles affichées automatiquement aux joueurs au lancement de chaque match
  default-rules:
    - "Pas de triche, pas de X-Ray, pas de clients modifiés"
    - "Pas de macros ni d'auto-clicker"
    - "Une déconnexion volontaire pendant un match peut être sanctionnée par un forfait"
    - "Respecte l'arbitre et les autres joueurs"

  # Commandes exécutées depuis la console à la fin d'un tournoi (placeholder : %player%)
  rewards:
    champion:
      - "eco give %player% 1000"
      - "give %player% diamond 5"
    runner-up:
      - "eco give %player% 500"
    third-place:
      - "eco give %player% 250"
