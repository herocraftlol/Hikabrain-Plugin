# ===========================================
#         Configuration HikaBrain
# ===========================================

# Nombre de joueurs minimum pour lancer le compte à rebours du lobby
min-players: 2

# Nombre de joueurs maximum (au-delà, équilibrage par équipe)
max-players: 16 # Valeur par défaut utilisée par toute arène sans max spécifique (voir /hb setmaxplayers)

# Durée du compte à rebours du lobby dès que le nombre minimum de joueurs est atteint (en secondes)
lobby-countdown-min-reached: 10

# Durée du compte à rebours quand le lobby est plein (accélère encore plus le départ)
lobby-countdown-fast: 10

# Nombre de points nécessaires pour gagner la partie
points-to-win: 5

# Durée (en secondes) du compte à rebours entre chaque round, après qu'un point a été marqué
round-reset-countdown: 5

# Téléporte les joueurs au lobby au démarrage du plugin / fin de partie
teleport-to-lobby-on-end: true

# Restaure les joueurs à leur position d'avant le lobby à la fin de la partie
restore-pre-lobby-location: true

# Délai (secondes) avant de relancer un nouveau lobby après la fin d'une partie
restart-delay: 5

# ===========================================
#         Configuration Scoreboard
# ===========================================
scoreboard:
  # Titre du scoreboard (affiché en haut)
  title: "&8[&b&lHEROCRAFT&8&l] &6&lHikaBrain"
  
  # Nom du serveur affiché dans le scoreboard
  server-name: "&b&lHEROCRAFT"
  
  # Nom du jeu affiché dans le scoreboard
  game-name: "&6&lHikaBrain"
  
  # Lignes du scoreboard (variables: %server%, %game%, %red_score%, %blue_score%, %red_kills%, %red_deaths%, %blue_kills%, %blue_deaths%, %red_kd%, %blue_kd%, %red_wins%, %blue_wins%, %players%, %elapsed_time%)
  # Sépare chaque ligne par un nouvelle entrée dans la liste
  lines:
    - "&7&m--------------------"
    - "&fServeur: &b%server%"
    - "&fJeu: &6%game%"
    - "&7&m--------------------"
    - "&f&l▸ &c❤ &fRouge: &c%red_score%"
    - "&f&l▸ &9❤ &9Bleu: &9%blue_score%"
    - "&7&m--------------------"
    - "&f&l▸ &cKills: &c%red_kills% &7/ &cDeaths: &c%red_deaths%"
    - "&f&l▸ &9Kills: &9%blue_kills% &7/ &9Deaths: &9%blue_deaths%"
    - "&7&m--------------------"
    - "&f&l▸ &cVictoires: &c%red_wins%"
    - "&f&l▸ &9Victoires: &9%blue_wins%"
    - "&7&m--------------------"
    - "&f&l▸ &cK/D: &c%red_kd%"
    - "&f&l▸ &9K/D: &9%blue_kd%"
    - "&7&m--------------------"
    - "&fTemps: &e%elapsed_time%"
    - "&fJoueurs: &a%players%"
    - "&7&m--------------------"

# Messages (couleurs avec & supportées)
messages:
  prefix: "&8[&bHikaBrain&8] &r"
  join: "&aTu as rejoint la partie ! &7(%current%/%max%)"
  leave: "&cTu as quitté la partie."
  team-assigned: "&7Tu es dans l'équipe %team%"
  team-changed: "&aTu as rejoint l'équipe %team%"
  countdown-start: "&eLa partie commence dans &6%time%&e secondes !"
  game-start: "&a&lLA PARTIE COMMENCE !"
  point-scored: "&6+%points% point(s) pour l'équipe %team% &7(%score%/%win%)"
  game-end: "&a&lL'équipe %team% a gagné la partie !"
  not-enough-players: "&cPas assez de joueurs pour démarrer."

# ===========================================
#         Configuration Tournois
# ===========================================
tournament:
  # Durée par défaut (secondes) d'une manche/course aux points avant décision au score/survivants
  default-time-limit-seconds: 600

  # Délai de grâce (secondes) avant qu'un joueur totalement déconnecté ne fasse perdre son équipe par forfait
  disconnect-grace-seconds: 60

  # Règles affichées automatiquement aux joueurs au lancement de chaque match
  default-rules:
    - "Pas de triche, pas de X-Ray, pas de clients modifiés"
    - "Pas de macros ni d'auto-clicker"
    - "Une déconnexion volontaire pendant un match peut être sanctionnée par un forfait"
    - "Respecte l'arbitre et les autres joueurs"

  # Commandes exécutées depuis la console à la fin d'un tournoi (placeholder : %player%)
  rewards:
    champion:
      - "eco give %player% 1000"
      - "give %player% diamond 5"
    runner-up:
      - "eco give %player% 500"
    third-place:
      - "eco give %player% 250"
